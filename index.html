    <style>
      :root { 
        scroll-padding-top: 6rem;
        --accent: #22d3ee;
        --accent-secondary: #3b82f6;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #020617;
        color: #ffffff;
        position: relative;
        overflow-x: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-image: 
          radial-gradient(circle at 2px 2px, rgba(34, 211, 238, 0.05) 1px, transparent 0),
          linear-gradient(to right, rgba(15, 23, 42, 0.02) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(15, 23, 42, 0.02) 1px, transparent 1px);
        background-size: 40px 40px, 100px 100px, 100px 100px;
        z-index: -2;
      }
      .font-display { font-family: 'Outfit', sans-serif; }
      .glass {
        background: rgba(2, 6, 23, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(34, 211, 238, 0.1);
      }
      .gradient-text {
        background: linear-gradient(135deg, #ffffff 30%, #22d3ee 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
      
      @keyframes pulse-glow {
        0% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.4); }
        70% { box-shadow: 0 0 0 20px rgba(34, 211, 238, 0); }
        100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0); }
      }
      .animate-pulse-glow {
        animation: pulse-glow 2s infinite;
      }

      @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
      .animate-marquee { display: flex; width: max-content; animation: marquee 30s linear infinite; }
      .animate-marquee:hover { animation-play-state: paused; }
      
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      /* Mobile Specific Overrides */
      @media (max-width: 768px) { 
        .container { padding-left: 20px !important; padding-right: 20px !important; }
        p { font-size: 1.1rem !important; line-height: 1.6 !important; color: #d1d5db !important; }
      }
    </style>

    <style>
      :root { 
        scroll-padding-top: 6rem;

      /* Performance: Set font-display swap globally */
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #020617;
        color: #ffffff;
        position: relative;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }
      
      /* Mobile Bottom Padding to prevent bar overlap */
      @media (max-width: 767px) {
        body { padding-bottom: 90px; }
      }

      /* Optimized Grid Background */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: radial-gradient(circle at 2px 2px, rgba(34, 211, 238, 0.02) 1px, transparent 0);
        background-size: 48px 48px;
        z-index: -2;
        pointer-events: none;
      }
      
      .font-display { font-family: 'Outfit', sans-serif; font-display: swap; }
      
      .glass {
        background: rgba(2, 6, 23, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .reveal {
        opacity: 0;
        transform: translateY(15px);
        transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        will-change: opacity, transform;
      }

      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
      
      /* Marquee Animation */
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      
      .animate-marquee {
        animation: marquee 30s linear infinite;
        display: flex;
        width: max-content;
      }
      
      .animate-marquee:hover {
        animation-play-state: paused;
      }

      /* CLS Prevention: Reserve space for images */
      img {
        content-visibility: auto;
      }

      @media (max-width: 640px) {
        h1 { font-size: 2.75rem !important; }
        .reveal { transition-duration: 0.3s; }
      }
    </style>
